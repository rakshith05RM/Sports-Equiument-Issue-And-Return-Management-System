{% extends "base.html" %}
{% block title %}Edit Category{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title"><i class="bi bi-pencil"></i> Edit Category</h1>
  </div>
</div>
<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Category Name *</label>
        <input type="text" class="form-control" name="category_name" value="{{ category.category_name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="3">{{ category.description or '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Update Category</button>
      <a href="{{ url_for('categories.list_categories') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

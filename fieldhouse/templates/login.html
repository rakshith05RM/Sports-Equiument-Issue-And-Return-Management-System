{% extends "base.html" %}
{% block title %}Sign in — Fieldhouse{% endblock %}
{% block content %}
<div class="fh-auth-wrapper">
  <div class="fh-auth-card">
    <div class="fh-auth-brand">
      <span class="fh-brand-mark">FH</span>
      <div>
        <h1 class="fh-auth-title">Fieldhouse</h1>
        <div class="fh-auth-sub">Sign in to your operations console</div>
      </div>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="form-label">Username or email</label>
        <input type="text" class="form-control" name="username" required autofocus placeholder="you@fieldhouse.app">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
        Sign in
      </button>
    </form>

    <div class="fh-auth-footer">
      New here? <a href="{{ url_for('auth.register') }}">Request an account</a>
    </div>


  </div>
</div>
{% endblock %}

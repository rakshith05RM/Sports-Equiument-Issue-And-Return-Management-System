{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-signpost-2 display-1 text-muted"></i>
  <h2 class="fw-bold mt-3">404 - Page Not Found</h2>
  <p class="text-muted">The page you are looking for does not exist.</p>
  <a href="{{ url_for('dashboard.index') if session.get('user_id') else url_for('auth.login') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}

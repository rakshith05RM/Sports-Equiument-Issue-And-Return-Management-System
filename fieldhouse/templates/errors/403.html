{% extends "base.html" %}
{% block title %}403 - Forbidden{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-shield-lock display-1 text-danger"></i>
  <h2 class="fw-bold mt-3">403 - Access Denied</h2>
  <p class="text-muted">You don't have permission to access this page.</p>
  <a href="{{ url_for('dashboard.index') if session.get('user_id') else url_for('auth.login') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}

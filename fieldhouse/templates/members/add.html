{% extends "base.html" %}
{% block title %}Add Member{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title"><i class="bi bi-plus-circle"></i> Add Member</h1>
  </div>
</div>
<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Student/Player ID *</label>
          <input type="text" class="form-control" name="student_code" value="{{ form.get('student_code','') }}" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-control" name="full_name" value="{{ form.get('full_name','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" value="{{ form.get('email','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" name="phone" value="{{ form.get('phone','') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Gender</label>
          <select class="form-select" name="gender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Date of Birth</label>
          <input type="date" class="form-control" name="date_of_birth" value="{{ form.get('date_of_birth','') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select class="form-select" name="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Department</label>
          <input type="text" class="form-control" name="department" value="{{ form.get('department','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Course/Class</label>
          <input type="text" class="form-control" name="course_class" value="{{ form.get('course_class','') }}">
        </div>
        <div class="col-md-8">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" name="address" value="{{ form.get('address','') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Emergency Contact</label>
          <input type="text" class="form-control" name="emergency_contact" value="{{ form.get('emergency_contact','') }}">
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Member</button>
        <a href="{{ url_for('members.list_members') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

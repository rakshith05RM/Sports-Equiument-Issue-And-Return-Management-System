{% extends "base.html" %}
{% block title %}Edit Member{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title"><i class="bi bi-pencil"></i> Edit Member</h1>
  </div>
</div>
<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Student/Player ID</label>
          <input type="text" class="form-control" value="{{ member.student_code }}" disabled>
        </div>
        <div class="col-md-8">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-control" name="full_name" value="{{ member.full_name }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" value="{{ member.email or '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" name="phone" value="{{ member.phone or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Gender</label>
          <select class="form-select" name="gender">
            <option value="">Select</option>
            <option value="Male" {% if member.gender=='Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if member.gender=='Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if member.gender=='Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Date of Birth</label>
          <input type="date" class="form-control" name="date_of_birth" value="{{ member.date_of_birth }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select class="form-select" name="status">
            <option value="Active" {% if member.status=='Active' %}selected{% endif %}>Active</option>
            <option value="Inactive" {% if member.status=='Inactive' %}selected{% endif %}>Inactive</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Department</label>
          <input type="text" class="form-control" name="department" value="{{ member.department or '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Course/Class</label>
          <input type="text" class="form-control" name="course_class" value="{{ member.course_class or '' }}">
        </div>
        <div class="col-md-8">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" name="address" value="{{ member.address or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Emergency Contact</label>
          <input type="text" class="form-control" name="emergency_contact" value="{{ member.emergency_contact or '' }}">
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Update Member</button>
        <a href="{{ url_for('members.list_members') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

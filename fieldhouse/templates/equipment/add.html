{% extends "base.html" %}
{% block title %}Add Equipment{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title"><i class="bi bi-plus-circle"></i> Add Equipment</h1>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Equipment Name *</label>
          <input type="text" class="form-control" name="equipment_name" value="{{ form.get('equipment_name','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Category *</label>
          <select class="form-select" name="category_id" required>
            <option value="">Select category</option>
            {% for c in categories %}
            <option value="{{ c.category_id }}" {% if form.get('category_id')|string == c.category_id|string %}selected{% endif %}>{{ c.category_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Brand</label>
          <input type="text" class="form-control" name="brand" value="{{ form.get('brand','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Model</label>
          <input type="text" class="form-control" name="model" value="{{ form.get('model','') }}">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description" rows="2">{{ form.get('description','') }}</textarea>
        </div>
        <div class="col-md-4">
          <label class="form-label">Total Quantity *</label>
          <input type="number" min="0" class="form-control" name="total_quantity" value="{{ form.get('total_quantity','0') }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Purchase Date</label>
          <input type="date" class="form-control" name="purchase_date" value="{{ form.get('purchase_date','') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Purchase Price (₹)</label>
          <input type="number" min="0" step="0.01" class="form-control" name="purchase_price" value="{{ form.get('purchase_price','0') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Condition</label>
          <select class="form-select" name="condition_status">
            {% for cond in conditions %}
            <option value="{{ cond }}" {% if form.get('condition_status') == cond %}selected{% endif %}>{{ cond }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Location</label>
          <input type="text" class="form-control" name="location" value="{{ form.get('location','') }}" placeholder="e.g. Store Room A">
        </div>
        <div class="col-md-4">
          <label class="form-label">Supplier</label>
          <input type="text" class="form-control" name="supplier" value="{{ form.get('supplier','') }}">
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Equipment</button>
        <a href="{{ url_for('equipment.list_equipment') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
